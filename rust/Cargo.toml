[workspace]
resolver = "3"
members = ["aeoi-core", "aeoi-control", "aeoi-mcp", "aeoi-bridge", "aeoi-web", "aeoi-wasm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
base64 = "0.22"
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }

[profile.release]
debug = false
[profile.test]
opt-level = 2

# Size-optimised profile for the browser build (aeoi-wasm). opt-level/LTO do not change IEEE-754
# results (no fast-math); the wasm-vs-native parity run checks it.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
