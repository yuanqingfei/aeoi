# Parity — control.lti.pade 0.3.0
operator: control.lti.pade
references:
  - {engine: mpmath, version: "1.3.0 dps=50", role: high_precision, status: active, generator: scripts/golden/gen_golden_b3.py, golden_store: "golden/mpmath/control.lti.pade/0.3.0/*.json", note: "normalized Padé recurrence. N≤4 also checked against control.pade; higher N is not, because the unnormalized f64 product loses digits. NOT MATLAB. No matrix input, so memory_order_nonsymmetric is not applicable."}
runner: "cargo test --release -p aeoi-control --test parity_b3"
tolerance_class: T1
memory_order_nonsymmetric: not_applicable
compare:
  "tf coefficients": "max |Δ| / max(1, max|ref|) ≤ 1e-12"
  "approximation error": "reported in result.approximation; not part of the coefficient tolerance"
case_families:
  - {name: n1, n: 2}
  - {name: n2, n: 1}
  - {name: n3, n: 1}
  - {name: n4, n: 1}
  - {name: n5, n: 1}
  - {name: n8, n: 1}
  - {name: n10, n: 1}
  - {name: order_zero, n: 1, expect: E.VALIDATION.SCHEMA}
  - {name: negative_delay, n: 1, expect: E.VALIDATION.SCHEMA}
pass_rule: "coefficients match 50-digit values within T1; missing order/delay is a schema error (no default)"
