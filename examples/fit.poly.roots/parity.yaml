# Parity test spec — fit.poly.roots 0.4.0 (AEOI v0.4.20-draft)
operator: fit.poly.roots
references:
  - {engine: numpy, version: "numpy.roots (LAPACK eigenvalues of the unbalanced companion matrix)", role: dev_reference, status: active,
     generator: gen_golden_poly.py, golden_store: "golden/python-control/fit.poly.roots/0.4.0/*.json",
     note: "NOT MATLAB output. MATLAB roots: eigenvalues of the companion matrix, order as returned by eig"}
  - {engine: mpmath, role: high_precision_reference, status: active,
     note: "mpmath.polyroots at 60 digits on the stored f64 coefficients; every truth root verified by its residual (≤ 1e-40 relative); the inclusion theorem checked on numpy's approximations"}
  - {engine: MATLAB, role: ground_truth, status: planned}
runner: "cargo test --release -p aeoi-numeric --test parity_poly"
tolerance_class: T2
compare:
  roots: {against: mpmath truth, bound: "simple roots: |z − r| ≤ 32u·q̃(|r|)/|q'(r)| + 2u|r| (absolute condition of a simple root); order exact (real part ascending, ties by imaginary part descending)"}
  error_radius: "claim check: every true root lies within error_radius of some reported root"
  multiplicity: "every truly multiple root (equal to 30 digits) is reported in a cluster of at least that size"
  warnings: "W.ACCURACY.CLUSTERED_ROOTS exactly for the cases with a truly multiple root; W.VALIDATION.LEADING_ZEROS_STRIPPED for leading zeros"
conformance_compare:   # spec 9.4 CF-6; conformance/rules_numeric.py (rule_roots)
  roots: "count = degree; order; simple roots against the truth with the bound above"
  error_radius: "claim check as above"
  echoed: "degree, zero_roots"
case_families:
  - {name: "cubic_distinct / complex_pair / trailing_zeros / leading_zeros / linear / constant_no_roots", n: 6}
  - {name: "double_root / triple_root / double_plus_simple", n: 3, note: "clusters: the roots inside are not individually determined"}
  - {name: "wilkinson10 / chebyshev_T12 / unit_roots_8 / scale_disparity / close_pair / random_degree30", n: 6}
  - {name: errors, n: 5, expect: "E.DOMAIN.ZERO_POLYNOMIAL, NON_FINITE, SHAPE, RANGE (degree > 500), SCHEMA"}
