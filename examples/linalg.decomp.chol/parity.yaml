# Parity test spec — linalg.decomp.chol 0.4.0 (AEOI v0.4.24-draft)
operator: linalg.decomp.chol
references:
  - {engine: mpmath, role: high_precision_reference, status: active, generator: scripts/golden/gen_golden_decomp.py,
     golden_store: "golden/mpmath/linalg.decomp.chol/0.4.0/*.json",
     note: "truth for the stored f64 data at 50 digits; NOT MATLAB output"}
  - {engine: MATLAB, role: ground_truth, status: planned}
runner: "cargo test --release -p aeoi-numeric --test parity_decomp"
tolerance_class: T1
compare:
  R: "‖ΔR‖_F/‖R‖_F ≤ 1e-12·max(1, κ₁/100) against the Cholesky factor of the upper-triangle matrix"
conformance_compare:   # spec 9.4 CF-6; conformance/rules_numeric.py. No trust.* value of the implementation is used as a tolerance
  R: "same bound as compare"
  recomputed: "the runner checks the triangle and recomputes ‖S − RᵀR‖_F/‖S‖_F (S built from the upper triangle) in exact rational arithmetic (≤ 100·n·u)"
case_families:
  - {name: "random SPD n = 1, 3, 10, 30 / lower triangle / Hilbert 8 / rounding asymmetry inside the tolerance (accepted)", n: 7}
  - {name: errors, n: 5, expect: "NOT_POSITIVE_DEFINITE ×2 (indefinite, semidefinite), NOT_SYMMETRIC, SHAPE, DTYPE"}
