# Parity — control.lti.feedback 0.3.0
operator: control.lti.feedback
references:
  - {engine: python-control, version: "0.10.2", role: dev_reference, status: active, generator: gen_golden_b3.py, golden_store: "golden/python-control/control.lti.feedback/0.3.0/*.json", note: "NOT MATLAB"}
runner: "cargo test --release -p aeoi-control --test parity_b3"
tolerance_class: T2
compare:
  "tf coefficients / ss matrices": "max |Δ| / max(1, max|ref|) ≤ 1e-10 (algebraic-loop solve)"
case_families:
  - {name: siso_tf, n: 8}
  - {name: unity, n: 1}
  - {name: algebraic_loop, n: 1, expect: E.DOMAIN.ALGEBRAIC_LOOP}
  - {name: memory_order_nonsymmetric, n: 1}
pass_rule: "within T2; algebraic loop returns E.DOMAIN.ALGEBRAIC_LOOP; column-major mistake deviates by > 1e3 × tolerance"
